<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#cad-cam' | relative_url }}">CAD/CAM</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        {% include resume-link.html class="nav-resume" pending_label="Resume" %}
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>{{ site.title }}</span>
      <span class="footer-links">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="{{ site.linkedin }}">LinkedIn</a>
        {% include resume-link.html %}
      </span>
    </div>
  </footer>

  <dialog class="viewer" id="viewer" aria-label="Full-size image">
    <button class="viewer-close" type="button" aria-label="Close">&times;</button>
    <img alt="">
    <p class="viewer-caption"></p>
  </dialog>
  <script>
    (function () {
      var dlg = document.getElementById('viewer');
      if (!dlg || typeof dlg.showModal !== 'function') return; // old browsers: links open the image directly
      var img = dlg.querySelector('img');
      var cap = dlg.querySelector('.viewer-caption');
      document.addEventListener('click', function (e) {
        var link = e.target.closest('.figure a');
        if (!link || !link.querySelector('img')) return;
        e.preventDefault();
        var thumb = link.querySelector('img');
        var fig = link.closest('figure');
        var fc = fig && fig.querySelector('figcaption');
        img.src = link.getAttribute('href');
        img.alt = thumb.alt;
        var text = '';
        if (fc) {
          var c = fc.cloneNode(true);
          c.querySelectorAll('a').forEach(function (a) { a.remove(); });
          c.querySelectorAll('br').forEach(function (br) { br.replaceWith(' · '); });
          text = c.textContent.replace(/\s+/g, ' ').replace(/(\s·\s*)+$/, '').trim();
        }
        cap.textContent = text;
        dlg.showModal();
      });
      dlg.addEventListener('click', function (e) {
        if (e.target === dlg || e.target.closest('.viewer-close')) dlg.close();
      });
      dlg.addEventListener('close', function () { img.removeAttribute('src'); });
    })();
  </script>
</body>
</html>
